name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          # Home Assistant 2026.7 declares Requires-Python >=3.14.2.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Install the integration's own requirements
        # Read from manifest.json rather than repeated here, so the two cannot
        # drift apart. A missing one fails at import time, which reads as ten
        # collection errors rather than as a missing dependency.
        run: |
          python -c "import json; print(chr(10).join(json.load(open('custom_components/audiconnect/manifest.json'))['requirements']))" | tee /tmp/manifest-requirements.txt
          pip install -r /tmp/manifest-requirements.txt

      - name: Run tests
        run: pytest
